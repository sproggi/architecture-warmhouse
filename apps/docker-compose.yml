version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: smarthome
      POSTGRES_PASSWORD: smarthome
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarthome"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smarthome-network

  temperature-api:
    build:
      context: ./temperature_api
      dockerfile: Dockerfile
    container_name: temperature-api
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - smarthome-network
    volumes:
      - ./temperature_api/openapi.yaml:/app/openapi.yaml

  smart_home:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://smarthome:smarthome@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
      - PORT=:8080
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network
    volumes:
      - ./smart_home/openapi.yaml:/app/openapi.yaml

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: swagger-ui
    ports:
      - "8082:8080"
    environment:
      - URLS=[{"name":"Smart Home API","url":"/smart_home.yaml"},{"name":"Temperature API","url":"/temperature_api.yaml"}]
      - URLS_PRIMARY_NAME=Smart Home API
      - SWAGGER_UI_BUNDLE_URL=/docs
    volumes:
      - ./smart_home/openapi.yaml:/usr/share/nginx/html/smart_home.yaml
      - ./temperature_api/openapi.yaml:/usr/share/nginx/html/temperature_api.yaml
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge